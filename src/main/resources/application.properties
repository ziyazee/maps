spring.application.name=maps
server.port=5189

# Database is disabled by default so the app is not coupled to a local MySQL instance.
# Enable it in an environment by setting APP_DATABASE_ENABLED=true and provide either
# APP_DATABASE_JDBC_URL or the host/name/user/password values below.
app.database.enabled=${APP_DATABASE_ENABLED:false}
app.database.provider=${APP_DATABASE_PROVIDER:mysql}
app.database.host=${APP_DATABASE_HOST:localhost}
app.database.port=${APP_DATABASE_PORT:3306}
app.database.name=${APP_DATABASE_NAME:maps}
app.database.username=${APP_DATABASE_USERNAME:}
app.database.password=${APP_DATABASE_PASSWORD:}
app.database.jdbc-url=${APP_DATABASE_JDBC_URL:}
app.database.parameters=${APP_DATABASE_PARAMETERS:useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
